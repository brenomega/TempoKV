services:
  primary:
    build:
      context: .
    image: tempokv:local
    environment:
      TEMPOKV_DATA_DIR: /data
      TEMPOKV_PERSISTENCE_ENABLED: "true"
      TEMPOKV_NODE_ROLE: PRIMARY
      TEMPOKV_NODE_ID: primary
      TEMPOKV_BIND_ADDRESS: 0.0.0.0
      TEMPOKV_ALLOW_INSECURE_REMOTE_TRANSPORT: "true"
      TEMPOKV_AUTHENTICATION_ENABLED: "false"
      TEMPOKV_REPLICATION_ENABLED: "true"
      TEMPOKV_REPLICATION_PORT: "6381"
      TEMPOKV_REPLICATION_TOKEN: ${TEMPOKV_REPLICATION_TOKEN:?set TEMPOKV_REPLICATION_TOKEN}
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:6380:6380"
    volumes:
      - tempokv-primary-data:/data
    healthcheck:
      test:
        - CMD
        - java
        - -cp
        - /opt/tempokv/app.jar
        - io.tempokv.bootstrap.RespHealthProbe
        - 127.0.0.1
        - "6379"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 15s

  replica:
    image: tempokv:local
    depends_on:
      primary:
        condition: service_healthy
    environment:
      TEMPOKV_DATA_DIR: /data
      TEMPOKV_PERSISTENCE_ENABLED: "true"
      TEMPOKV_NODE_ROLE: REPLICA
      TEMPOKV_NODE_ID: replica
      TEMPOKV_BIND_ADDRESS: 0.0.0.0
      TEMPOKV_ALLOW_INSECURE_REMOTE_TRANSPORT: "true"
      TEMPOKV_AUTHENTICATION_ENABLED: "false"
      TEMPOKV_REPLICATION_ENABLED: "true"
      TEMPOKV_PRIMARY_HOST: primary
      TEMPOKV_PRIMARY_REPLICATION_PORT: "6381"
      TEMPOKV_REPLICATION_PORT: "6381"
      TEMPOKV_REPLICATION_TOKEN: ${TEMPOKV_REPLICATION_TOKEN:?set TEMPOKV_REPLICATION_TOKEN}
    ports:
      - "127.0.0.1:7379:6379"
      - "127.0.0.1:7380:6380"
    volumes:
      - tempokv-replica-data:/data
    restart: on-failure
    stop_grace_period: 15s

volumes:
  tempokv-primary-data:
  tempokv-replica-data:
