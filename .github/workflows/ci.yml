name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and verify
        run: ./gradlew --no-daemon clean build

      - name: Validate Compose configuration
        env:
          TEMPOKV_REPLICATION_TOKEN: ci-explicit-replication-secret
        run: docker compose config

      - name: Build production image
        run: docker build --tag tempokv:ci .

      - name: Smoke-test image with redis-cli
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools
          container_id="$(docker run --detach \
            --env TEMPOKV_BIND_ADDRESS=0.0.0.0 \
            --env TEMPOKV_ALLOW_INSECURE_REMOTE_TRANSPORT=true \
            --env TEMPOKV_AUTHENTICATION_ENABLED=false \
            --publish 127.0.0.1::6379 tempokv:ci)"
          redis_id="$(docker run --detach --publish 127.0.0.1::6379 redis:7-alpine)"
          trap 'docker rm --force "$container_id" "$redis_id"' EXIT
          port="$(docker inspect --format='{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$container_id")"
          redis_port="$(docker inspect --format='{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$redis_id")"
          for attempt in {1..40}; do
            if redis-cli -h 127.0.0.1 -p "$port" PING | grep --quiet PONG \
              && redis-cli -h 127.0.0.1 -p "$redis_port" PING | grep --quiet PONG; then
              break
            fi
            sleep 0.25
          done
          test "$(redis-cli -h 127.0.0.1 -p "$port" PING)" = "PONG"
          test "$(redis-cli -h 127.0.0.1 -p "$port" SET profile first)" = "OK"
          test "$(redis-cli -h 127.0.0.1 -p "$port" SET profile second)" = "OK"
          test "$(redis-cli -h 127.0.0.1 -p "$port" GETAT profile VERSION 1)" = "first"
          test "$(redis-cli -h 127.0.0.1 -p "$port" RESTOREAT profile 1)" = "3"
          test "$(redis-cli -h 127.0.0.1 -p "$port" GET profile)" = "first"
          for command in \
            "SET compat:name Ada" \
            "GET compat:name" \
            "DEL compat:name" \
            "GET compat:name" \
            "SET compat:temporary value" \
            "TTL compat:temporary" \
            "EXPIRE compat:temporary 0" \
            "TTL compat:temporary" \
            "GET compat:temporary"; do
            tempokv_result="$(redis-cli -h 127.0.0.1 -p "$port" $command)"
            redis_result="$(redis-cli -h 127.0.0.1 -p "$redis_port" $command)"
            test "$tempokv_result" = "$redis_result"
          done
